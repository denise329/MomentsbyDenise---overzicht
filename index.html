/* ---------- hulpjes ---------- */
const euro = (n) =>
  new Intl.NumberFormat("nl-NL", {
    style: "currency",
    currency: "EUR",
    maximumFractionDigits: 2,
  }).format(Number(n) || 0);

const pad = (n) => String(n).padStart(2, "0");
const vandaag = () => new Date().toISOString().slice(0, 10);

const datumKort = (d) =>
  new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "short" });

function kwartaalVan(datum) {
  const d = new Date(datum);
  return { jaar: d.getFullYear(), k: Math.floor(d.getMonth() / 3) + 1 };
}

function kwartaalLabel({ jaar, k }) {
  return `Q${k} ${jaar}`;
}

function aangifteDeadline({ jaar, k }) {
  const maand = k * 3; // 0-indexed maand na kwartaal
  const d = new Date(jaar, maand + 1, 0);
  return d;
}

const btwUitExcl = (excl, tarief) => (Number(excl) || 0) * (Number(tarief) / 100);
const btwUitIncl = (incl, tarief) => {
  const i = Number(incl) || 0;
  const t = Number(tarief) / 100;
  return i - i / (1 + t);
};

function dagenOpen(datum) {
  return Math.floor((Date.now() - new Date(datum)) / 86400000);
}

function lokaleStamp(d) {
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(
    d.getHours()
  )}${pad(d.getMinutes())}00`;
}
const utcStamp = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

function startEind(a) {
  const start = new Date(`${a.datum}T${a.tijd || "09:00"}`);
  return { start, eind: new Date(start.getTime() + (Number(a.duur) || 120) * 60000) };
}

function googleLink(a) {
  const { start, eind } = startEind(a);
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: a.titel,
    dates: `${utcStamp(start)}/${utcStamp(eind)}`,
    details: a.notitie || "",
    location: a.locatie || "",
  });
  return `https://calendar.google.com/calendar/render?${p}`;
}

function maakICS(lijst) {
  const esc = (s) =>
    String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const r = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MomentsbyDenise//NL", "CALSCALE:GREGORIAN"];
  lijst.forEach((a) => {
    const { start, eind } = startEind(a);
    r.push(
      "BEGIN:VEVENT",
      `UID:${a.id}@mbd`,
      `DTSTAMP:${utcStamp(new Date())}`,
      `DTSTART:${lokaleStamp(start)}`,
      `DTEND:${lokaleStamp(eind)}`,
      `SUMMARY:${esc(a.titel)}`,
      `DESCRIPTION:${esc(a.notitie)}`,
      `LOCATION:${esc(a.locatie)}`
    );
    if (Number(a.herinnering) > 0) {
      r.push("BEGIN:VALARM", `TRIGGER:-PT${a.herinnering}M`, "ACTION:DISPLAY", `DESCRIPTION:${esc(a.titel)}`, "END:VALARM");
    }
    r.push("END:VEVENT");
  });
  r.push("END:VCALENDAR");
  return r.join("\r\n");
}

function download(naam, inhoud, type) {
  const blob = new Blob([inhoud], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = naam;
  a.click();

}

const CATEGORIEEN = [

const TARIEVEN = [

const HERINNERINGEN = [

/* ---------- pdf uitlezen ---------- */
function naarGetal(s) {
  if (!s) return null;
  let t = String(s).replace(/[^\d.,-]/g, "");
  const k = t.lastIndexOf(","), p = t.lastIndexOf(".");
  if (k > -1 && p > -1) {
    if (k > p) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, "");
  } else if (k > -1) {
    t = t.length - k - 1 === 3 ? t.replace(/,/g, "") : t.replace(",", ".");
  } else if (p > -1 && t.length - p - 1 === 3) {
    t = t.replace(/\./g, "");
  }
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

function bedragen(regel) {
  const uit = [];
  for (const m of regel.matchAll(/\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)|\d{1,3}(?:,\d{3})*\.\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g))
    uit.push(naarGetal(m[0]));
  if (!uit.length) {
    for (const m of regel.matchAll(/€\s*(\d{1,7})(?![\d.,])/g)) uit.push(naarGetal(m[1]));
  }
  return uit.filter((x) => x !== null);
}

const MAANDEN = { januari:1, februari:2, maart:3, april:4, mei:5, juni:6, juli:7, augustus:8,
  september:9, oktober:10, november:11, december:12, jan:1, feb:2, mrt:3, apr:4, jun:6, jul:7,
  aug:8, sep:9, sept:9, okt:10, nov:11, dec:12 };

function vindDatum(tekst) {
  const bij = tekst.match(/(?:factuurdatum|factuur datum|datum|invoice date|date)[^\n]{0,30}/i);
  const bronnen = bij ? [bij[0], tekst] : [tekst];
  for (const bron of bronnen) {
    let m = bron.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = bron.match(/(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{4})/);
    if (m) return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
    m = bron.match(/(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{2})(?!\d)/);
    if (m) return `20${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
    m = bron.match(/(\d{1,2})\s+([a-zA-Z]{3,10})\.?\s+(\d{4})/);
    if (m && MAANDEN[m[2].toLowerCase()]) {
      return `${m[3]}-${String(MAANDEN[m[2].toLowerCase()]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
    }
  }
  return null;
}

function vindNummer(tekst) {
  const pats = [
    /factuur\s*(?:nummer|nr\.?|no\.?|#)?\s*[:#]?\s*(?=([A-Za-z0-9][A-Za-z0-9\-\/\.]{1,19}))/gi,
    /invoice\s*(?:number|no\.?|#)?\s*[:#]?\s*(?=([A-Za-z0-9][A-Za-z0-9\-\/\.]{1,19}))/gi,
  ];
  for (const p of pats) {
    for (const m of tekst.matchAll(p)) {
      const v = m[1].replace(/[.,:;]$/, "");
      if (/\d/.test(v) && !/^(datum|date)$/i.test(v)) return v;
    }
  }
  return null;
}

/* kern: alle btw-regels verzamelen, niet alleen de eerste */
function zoekDrieluik(regels) {
  let beste = null;
  regels.forEach((r) => {
    const b = bedragen(r);
    if (b.length < 3) return;
    const max = Math.max(...b);
    if (max < 1) return;
    for (let i = 0; i < b.length; i++) {
      for (let j = 0; j < b.length; j++) {
        if (i === j) continue;
        if (Math.abs(b[i] + b[j] - max) < 0.02 && b[i] > 0 && b[j] > 0 && b[i] !== max && b[j] !== max) {
          const excl = Math.max(b[i], b[j]);
          const btw = Math.min(b[i], b[j]);
          const p = Math.round((btw / excl) * 100);
          if ([21, 9, 0].includes(p)) beste = { excl, btw, incl: max, tarief: p };
        }
      }
    }
  });
  return beste;
}

function leesBedragen(tekst) {
  const regels = tekst.split("\n").map((r) => r.trim()).filter(Boolean);
  let incl = null, excl = null;
  const btwRegels = [];
  let verlegd = false;

  const isExclRegel = (l) => /subtotaal|totaal\s*(bedrag)?\s*excl|excl\.?\s*btw|bedrag\s*excl|netto/.test(l);
  const isInclRegel = (l) =>
    /totaal\s*(te betalen|incl|inclusief)|te betalen|totaalbedrag|eindtotaal|totaal\s*€|^totaal\b|bruto/.test(l);

  regels.forEach((r) => {
    const laag = r.toLowerCase();
    const b = bedragen(r);
    if (/btw\s*verlegd|reverse charge|verleggingsregeling/.test(laag)) verlegd = true;

    const totaalregel = isExclRegel(laag) || isInclRegel(laag);

    // btw-regel: alleen als het geen totaalregel is die toevallig het woord btw bevat
    if (
      (/\bbtw\b|\bvat\b|omzetbelasting/.test(laag)) &&
      !/nummer|nr\.|\bid\b|number|verlegd|vrijgesteld/.test(laag) &&
      !totaalregel
    ) {
      const tm = laag.match(/(\d{1,2})(?:[.,]\d{1,2})?\s*%/);
      const tarief = tm ? parseInt(tm[1], 10) : null;
      if (b.length) btwRegels.push({ tarief, bedrag: b[b.length - 1] });
      else if (tarief !== null) btwRegels.push({ tarief, bedrag: null });
    }

    if (!b.length) return;
    const laatste = b[b.length - 1];
    if (isExclRegel(laag)) {
      if (excl === null) excl = laatste;
    } else if (isInclRegel(laag)) {
      if (incl === null || laatste > incl) incl = laatste;
    }
  });

  // een btw-bedrag kan nooit groter zijn dan het totaal, anders is het een verdwaalde regel
  const grens = incl !== null ? incl * 0.6 : excl !== null ? excl * 0.6 : Infinity;
  const btwBedragen = btwRegels.filter((x) => x.bedrag !== null && x.bedrag <= grens);
  const btwTotaal = btwBedragen.length ? btwBedragen.reduce((s, x) => s + x.bedrag, 0) : null;
  const tarieven = [...new Set(btwRegels.map((x) => x.tarief).filter((t) => t !== null && t > 0))];

  if (incl === null && excl !== null && btwTotaal !== null) incl = excl + btwTotaal;
  if (incl === null) {
    const alle = regels.flatMap(bedragen);
    if (alle.length) incl = Math.max(...alle);
  }
  if (excl === null && incl !== null && btwTotaal !== null && btwTotaal < incl) excl = incl - btwTotaal;

  const d = zoekDrieluik(regels);
  if (d) {
    return {
      incl: d.incl,
      excl: d.excl,
      btwTotaal: d.btw,
      tarieven: [d.tarief],
      verlegd,
      meerdereTarieven: false,
    };
  }

  return { incl, excl, btwTotaal, tarieven, verlegd, meerdereTarieven: tarieven.length > 1 };
}

function bepaalTarief({ excl, btwTotaal, tarieven, verlegd }) {
  if (verlegd) return { tarief: 0, zeker: true };
  if (excl && btwTotaal !== null && excl > 0) {
    const p = Math.round((btwTotaal / excl) * 100);
    if ([21, 9, 0].includes(p)) return { tarief: p, zeker: true };
  }
  if (tarieven.length === 1 && [21, 9, 0].includes(tarieven[0])) {
    return { tarief: tarieven[0], zeker: true };
  }
  if (tarieven.length > 1) return { tarief: Math.max(...tarieven), zeker: false };
  return { tarief: 21, zeker: false };
}

function leesFactuur(tekst, bestandsnaam) {
  const b = leesBedragen(tekst);
  const { tarief, zeker } = bepaalTarief(b);
  let excl = b.excl;
  if (excl === null && b.incl !== null) excl = b.incl / (1 + tarief / 100);

  const regels = tekst.split("\n").map((r) => r.trim()).filter(Boolean);
  let klant = "";
  const i = regels.findIndex((r) => /^(aan|factuur aan|t\.a\.v\.|klant|bill to|gefactureerd aan)\b/i.test(r));
  if (i > -1) {
    const zelfde = regels[i].replace(/^(aan|factuur aan|t\.a\.v\.|klant|bill to|gefactureerd aan)\b[:\s]*/i, "").trim();
    klant = zelfde || regels[i + 1] || "";
  }

  const let_op = [];
  if (!klant) let_op.push("klantnaam");
  if (b.btwTotaal === null && !b.verlegd) let_op.push("btw");
  if (!zeker) let_op.push("tarief");
  if (excl === null) let_op.push("bedrag");
  if (b.meerdereTarieven) let_op.push("meerdere tarieven");

  return {
    klant,
    nummer: vindNummer(tekst) || "",
    datum: vindDatum(tekst) || new Date().toISOString().slice(0, 10),
    bedrag: excl !== null ? Math.round(excl * 100) / 100 : "",
    tarief,
    status: "open",
    _bestand: bestandsnaam || "",
    _letop: let_op,
  };
}

function leesRegelitems(tekst) {
  const regels = tekst.split("\n").map((r) => r.trim()).filter(Boolean);
  const heeftLetters = (s) => (s.match(/[a-zA-Z]/g) || []).length >= 3;
  const items = [];
  const gebruikt = new Set();

  regels.forEach((r, i) => {
    const laag = r.toLowerCase();
    if (/totaal|subtotaal|te betalen|factuur|datum|\bbtw\b|\bvat\b|nr\.|kvk|iban/.test(laag)) return;
    const b = bedragen(r);
    if (!b.length) return;
    const pos = r.search(/\d{1,3}(?:\.\d{3})*,\d{2}|\d{1,3}(?:,\d{3})*\.\d{2}/);
    if (pos < 0) return;

    let oms = r
      .slice(0, pos)
      .replace(/^\d{4,}\s*/, "")
      .replace(/[|\-\s]+$/, "")
      .trim();
    const zonderAantal = oms.replace(/\s+\d{1,3}$/, "").trim();
    if ((zonderAantal.match(/[a-zA-Z]/g) || []).length >= 3) oms = zonderAantal;

    if (!heeftLetters(oms)) {
      if (!/^\d{4,}\s/.test(r)) return;
      oms = "";
      for (const j of [i - 1, i + 1]) {
        const buur = regels[j];
        if (!buur || gebruikt.has(j)) continue;
        if (bedragen(buur).length) continue;
        if (!heeftLetters(buur)) continue;
        if (/totaal|btw|factuur|artikelnr|omschrijving/i.test(buur)) continue;
        oms = buur.replace(/[(\[][^)\]]*$/, "").trim();
        gebruikt.add(j);
        break;
      }
      if (!oms) return;
    }
    items.push({ omschrijving: oms, bedragen: b });
  });
  return items;
}

/* welke kolom is het bedrag? De kolom waarvan de som klopt met het totaal. */
function kiesBedragKolom(items, b) {
  if (!items.length) return { regels: [], zeker: false };
  const rond = (x) => Math.round(x * 100) / 100;

  for (const vanRechts of [0, 1, 2]) {
    const waarden = items.map((x) => x.bedragen[x.bedragen.length - 1 - vanRechts]);
    if (waarden.some((w) => w === undefined || w === null)) continue;
    const som = rond(waarden.reduce((s, w) => s + w, 0));

    if (b.incl !== null && Math.abs(som - b.incl) < 0.05) {
      return {
        regels: items.map((x, i) => ({ omschrijving: x.omschrijving, bedrag: rond(waarden[i]) })),
        zeker: true,
        kolom: "inclusief",
      };
    }
    if (b.excl !== null && b.incl !== null && b.excl > 0 && Math.abs(som - b.excl) < 0.05) {
      const factor = b.incl / b.excl;
      return {
        regels: items.map((x, i) => ({
          omschrijving: x.omschrijving,
          bedrag: rond(waarden[i] * factor),
        })),
        zeker: true,
        kolom: "exclusief, omgerekend naar inclusief",
      };
    }
  }

  // niks sluit aan: neem de laatste kolom, maar zeg erbij dat het nagekeken moet worden
  return {
    regels: items.map((x) => ({
      omschrijving: x.omschrijving,
      bedrag: rond(x.bedragen[x.bedragen.length - 1]),
    })),
    zeker: false,
  };
}

function leesUitgave(tekst, bestandsnaam) {
  const b = leesBedragen(tekst);
  const kolommen = kiesBedragKolom(leesRegelitems(tekst), b);
  const { tarief, zeker } = bepaalTarief(b);
  const regels = tekst.split("\n").map((r) => r.trim()).filter(Boolean);
  const leverancier =
    regels.find((r) => r.length > 2 && r.length < 45 && /[a-zA-Z]{3}/.test(r) &&
      !/factuur|invoice|datum|pagina|btw/i.test(r)) ||
    (bestandsnaam || "").replace(/\.pdf$/i, "");

  const let_op = [];
  if (b.btwTotaal === null && !b.verlegd) let_op.push("btw");
  if (!zeker) let_op.push("tarief");
  if (b.incl === null) let_op.push("bedrag");
  if (b.meerdereTarieven) let_op.push("meerdere tarieven");
  if (kolommen.regels.length > 1 && !kolommen.zeker) let_op.push("bedragen per regel");

  return {
    naam: leverancier,
    omschrijving: "",
    apparatuur: false,
    _regels: kolommen.regels,
    _regelsOnzeker: !kolommen.zeker,
    bedrag: b.incl !== null ? Math.round(b.incl * 100) / 100 : "",
    tarief,
    datum: vindDatum(tekst) || new Date().toISOString().slice(0, 10),
    categorie: "",
    zakelijk: true,
    _bestand: bestandsnaam || "",
    _letop: let_op,
  };
}

async function pdfTekst(file) {
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let uit = "";
  for (let p = 1; p <= Math.min(pdf.numPages, 5); p++) {
    const pagina = await pdf.getPage(p);
    const inhoud = await pagina.getTextContent();
    const regels = {};
    inhoud.items.forEach((i) => {
      const y = Math.round(i.transform[5]);
      regels[y] = (regels[y] || "") + i.str + " ";
    });
    uit +=
      Object.keys(regels)
        .sort((a, b) => b - a)
        .map((y) => regels[y].replace(/\s+/g, " ").trim())
        .filter(Boolean)
        .join("\n") + "\n";
  }
  return uit;
}

function Sleepvak({ uitleg, onKlaar }) {
  const [voortgang, setVoortgang] = useState(null);
  const [fout, setFout] = useState("");
  const [over, setOver] = useState(false);

  const verwerk = async (bestanden) => {
    const lijst = [...bestanden].filter((f) => /\.pdf$/i.test(f.name));
    const overgeslagen = [...bestanden].length - lijst.length;
    if (!lijst.length) {
      setFout("Ik zie geen PDF. Exporteer je factuur in Canva als PDF.");
      return;
    }
    setFout("");
    const uit = [];
    const mislukt = [];
    for (let i = 0; i < lijst.length; i++) {
      setVoortgang(`${i + 1} van ${lijst.length}`);
      try {
        const t = await pdfTekst(lijst[i]);
        if (!t || t.replace(/\s/g, "").length < 25) mislukt.push(lijst[i].name);
        else uit.push({ tekst: t, naam: lijst[i].name });
      } catch (e) {
        mislukt.push(lijst[i].name);
      }
    }
    setVoortgang(null);
    const meldingen = [];
    if (overgeslagen) meldingen.push(`${overgeslagen} bestand${overgeslagen > 1 ? "en" : ""} overgeslagen, geen PDF`);
    if (mislukt.length) meldingen.push(`Geen tekst gevonden in ${mislukt.join(", ")}. Dat is waarschijnlijk een foto of scan, die moet je met de hand invullen.`);
    setFout(meldingen.join(". "));
    if (uit.length) onKlaar(uit);
  };

  const kies = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/pdf";
    inp.multiple = true;
    inp.onchange = () => verwerk(inp.files);
    inp.click();
  };

  return (
    <div className="mb-5">
      <div
        onClick={kies}
        onDragOver={(e) => {
          e.preventDefault();
          setOver(true);
        }}
        onDragLeave={() => setOver(false)}
        onDrop={(e) => {
          e.preventDefault();
          setOver(false);
          verwerk(e.dataTransfer.files);
        }}
        className="px-5 py-8 text-center cursor-pointer"
        style={{
          border: `1px dashed ${over ? C.ink : C.line}`,
          background: over ? C.print : "transparent",
        }}
      >
        <div className="text-base" style={{ ...ui, color: C.ink }}>
          {voortgang ? `Bezig met lezen, ${voortgang}` : uitleg}
        </div>
        <div className="text-sm mt-1" style={{ ...display, fontStyle: "italic", color: C.soft }}>
          Sleep er gerust een hele stapel in, of klik om te kiezen
        </div>
      </div>
      {fout && (
        <p className="text-sm mt-2" style={{ ...ui, color: C.open }}>
          {fout}
        </p>
      )}
    </div>
  );
}

function LetOp({ punten }) {
  if (!punten || !punten.length) return null;
  return (
    <span className="text-sm px-2 py-1 ml-2" style={{ ...ui, background: C.openZacht, color: C.open }}>
      controleer {punten.join(" en ")}
    </span>
  );
}

function Controle({ soort, rijen, setRijen, opslaan }) {
  if (!rijen.length) return null;
  const zet = (i, k, v) => setRijen(rijen.map((r, j) => (i === j ? { ...r, [k]: v } : r)));
  const weg = (i) => setRijen(rijen.filter((_, j) => j !== i));
  const factuur = soort === "factuur";

  return (
    <div className="mb-6">
      <div className="flex items-baseline justify-between pb-2" style={{ borderBottom: `1px solid ${C.ink}` }}>
        <div className="text-xl" style={{ ...display, color: C.ink }}>
          {rijen.length} gelezen
        </div>
        <div className="text-sm" style={{ ...ui, color: C.soft }}>
          Controleer en sla op
        </div>
      </div>

      {rijen.map((r, i) => {
        const btw = factuur ? btwUitExcl(r.bedrag, r.tarief) : btwUitIncl(r.bedrag, r.tarief);
        return (
          <div key={i} className="py-4" style={{ borderBottom: `1px solid ${C.line}` }}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm" style={{ ...display, fontStyle: "italic", color: C.soft }}>
                {r._bestand}
              </span>
              <LetOp punten={r._letop} />
            </div>
            <Input
              value={factuur ? r.klant : r.naam}
              onChange={(e) => zet(i, factuur ? "klant" : "naam", e.target.value)}
              placeholder={factuur ? "Klantnaam" : "Van wie"}
            />
            {!factuur && (
              <div className="mt-2">
                <Input
                  value={r.omschrijving || ""}
                  onChange={(e) => zet(i, "omschrijving", e.target.value)}
                  placeholder="Wat is het, bijvoorbeeld Sony A7 IV"
                />
              </div>
            )}
            <div className="flex gap-2 mt-2">
              <Input type="date" value={r.datum} onChange={(e) => zet(i, "datum", e.target.value)} />
              <Input
                type="number"
                step="0.01"
                value={r.bedrag}
                onChange={(e) => zet(i, "bedrag", e.target.value)}
                placeholder={factuur ? "Excl. btw" : "Incl. btw"}
              />
              <Select value={r.tarief} onChange={(e) => zet(i, "tarief", Number(e.target.value))}>
                {TARIEVEN.map((t) => (
                  <option key={t.v} value={t.v}>
                    {t.v} procent
                  </option>
                ))}
              </Select>
            </div>
            <div className="text-sm mt-2" style={{ ...ui, color: C.soft }}>
              Btw {euro(btw)}
              {factuur
                ? `, totaal ${euro(Number(r.bedrag || 0) + btw)}`
                : `, kwartaal ${kwartaalLabel(kwartaalVan(r.datum))}`}
            </div>
            <div className="flex items-center gap-3 mt-2 flex-wrap">
              {!factuur && (
                <label
                  className="text-sm flex items-center gap-2 cursor-pointer"
                  style={{ ...ui, color: r.apparatuur ? C.ink : C.soft }}
                >
                  <input
                    type="checkbox"
                    checked={!!r.apparatuur}
                    onChange={() => zet(i, "apparatuur", !r.apparatuur)}
                  />
                  Zet dit ook bij apparatuur
                </label>
              )}
              {!factuur && r._regels && r._regels.length > 1 && (
                <Knop
                  klein
                  onClick={() =>
                    setRijen([
                      ...rijen.slice(0, i),
                      ...r._regels.map((x) => ({
                        ...r,
                        omschrijving: x.omschrijving,
                        bedrag: x.bedrag,
                        _regels: null,
                      })),
                      ...rijen.slice(i + 1),
                    ])
                  }
                >
                  Splitsen in {r._regels.length} regels
                </Knop>
              )}
              <div className="flex-1" />
              <Knop klein soort="weg" onClick={() => weg(i)}>
                Weghalen
              </Knop>
            </div>
          </div>
        );
      })}

      <div className="flex gap-2 mt-4">
        <Knop soort="vol" onClick={() => opslaan(rijen)}>
          Alle {rijen.length} opslaan
        </Knop>
        <Knop soort="weg" onClick={() => setRijen([])}>
          Wissen
        </Knop>
      </div>
    </div>
  );
}


function groepeerPerKwartaal(items) {
  const groepen = new Map();
  items.forEach((x) => {
    const kw = kwartaalVan(x.datum);
    const sleutel = `${kw.jaar}-${kw.k}`;
    if (!groepen.has(sleutel)) groepen.set(sleutel, { sleutel, kw, items: [] });
    groepen.get(sleutel).items.push(x);
  });
  return [...groepen.values()]
    .sort((a, b) => b.kw.jaar - a.kw.jaar || b.kw.k - a.kw.k)
    .map((g) => ({
      ...g,
      items: g.items.sort((a, b) => new Date(b.datum) - new Date(a.datum)),
    }));
}

function KwartaalKop({ kw, totaal, bijschrift }) {
  const nu = kwartaalVan(vandaag());
  const lopend = nu.jaar === kw.jaar && nu.k === kw.k;
  return (
    <div
      className="flex items-baseline justify-between pt-6 pb-2"
      style={{ borderBottom: `1px solid ${C.ink}` }}
    >
      <div className="text-xl" style={{ ...display, color: C.ink }}>
        {kwartaalLabel(kw)}
        {lopend && (
          <span className="text-sm ml-2" style={{ ...ui, color: C.soft }}>
            lopend kwartaal
          </span>
        )}
      </div>
      <div className="text-right">
        <div className="text-base" style={{ ...display, color: C.ink }}>
          {euro(totaal)}
        </div>
        <div className="text-sm" style={{ ...ui, color: C.soft }}>
          {bijschrift}
        </div>
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App() {
  const [data, setData] = useState(LEEG);
  const [klaar, setKlaar] = useState(false);
  const [melding, setMelding] = useState("");
  const [tab, setTab] = useState("overzicht");
  const [form, setForm] = useState(null);

  useEffect(() => {
    try {
      const r = localStorage.getItem(KEY);
      if (r) setData({ ...LEEG, ...JSON.parse(r) });
    } catch (e) {
      /* eerste keer, nog niks opgeslagen */
    }
    setKlaar(true);
  }, []);

  const bewaar = (nieuw) => {
    setData(nieuw);
    try {
      localStorage.setItem(KEY, JSON.stringify(nieuw));
      setMelding("");
    } catch (e) {
      setMelding("Opslaan lukte niet. Maak een export zodat je niks kwijtraakt.");
    }
  };

  const voegToe = (soort, item) =>
    bewaar({
      ...data,
      [soort]: [...data[soort], { ...item, id: Math.random().toString(36).slice(2, 9) }],
    });

  const voegMeerToe = (soort, items) =>
    bewaar({
      ...data,
      [soort]: [
        ...data[soort],
        ...items.map((i) => ({ ...i, id: Math.random().toString(36).slice(2, 9) })),
      ],
    });

  const voegGecombineerdToe = (paren) => {
    const nieuw = { ...data };
    Object.entries(paren).forEach(([soort, items]) => {
      if (!items || !items.length) return;
      nieuw[soort] = [
        ...nieuw[soort],
        ...items.map((i) => ({ ...i, id: Math.random().toString(36).slice(2, 9) })),
      ];
    });
    bewaar(nieuw);
  };

  const wijzig = (soort, id, patch) =>
    bewaar({
      ...data,
      [soort]: data[soort].map((x) => (x.id === id ? { ...x, ...patch } : x)),
    });

  const verwijder = (soort, id) =>
    bewaar({ ...data, [soort]: data[soort].filter((x) => x.id !== id) });

  /* berekeningen */
  const openstaand = useMemo(
    () => data.facturen.filter((f) => f.status !== "betaald"),
    [data.facturen]
  );
  const openBedrag = useMemo(
    () =>
      openstaand.reduce(
        (s, f) => s + (Number(f.bedrag) || 0) + btwUitExcl(f.bedrag, f.tarief),
        0
      ),
    [openstaand]
  );

  const huidigKwartaal = kwartaalVan(vandaag());

  const btwVan = (kw) => {
    const afdragen = data.facturen
      .filter((f) => {
        const q = kwartaalVan(f.datum);
        return q.jaar === kw.jaar && q.k === kw.k;
      })
      .reduce((s, f) => s + btwUitExcl(f.bedrag, f.tarief), 0);
    const terug = data.uitgaven
      .filter((u) => {
        const q = kwartaalVan(u.datum);
        return q.jaar === kw.jaar && q.k === kw.k && u.zakelijk !== false;
      })
      .reduce((s, u) => s + btwUitIncl(u.bedrag, u.tarief), 0);
    return { afdragen, terug, saldo: afdragen - terug };
  };

  const btwNu = useMemo(() => btwVan(huidigKwartaal), [data]);

  const omzetJaar = useMemo(() => {
    const jaar = new Date().getFullYear();
    return data.facturen
      .filter((f) => new Date(f.datum).getFullYear() === jaar)
      .reduce((s, f) => s + (Number(f.bedrag) || 0), 0);
  }, [data.facturen]);

  const uitgavenJaar = useMemo(() => {
    const jaar = new Date().getFullYear();
    return data.uitgaven
      .filter((u) => new Date(u.datum).getFullYear() === jaar)
      .reduce((s, u) => s + (Number(u.bedrag) || 0), 0);
  }, [data.uitgaven]);

  const kostenJaar = useMemo(() => {
    const jaar = new Date().getFullYear();
    return data.uitgaven
      .filter((u) => new Date(u.datum).getFullYear() === jaar && u.zakelijk !== false)
      .reduce((s, u) => s + (Number(u.bedrag) || 0) - btwUitIncl(u.bedrag, u.tarief), 0);
  }, [data.uitgaven]);

  const komendeShoots = useMemo(
    () =>
      data.shoots
        .map((s) => ({ ...s, _d: startEind(s).start }))
        .filter((s) => s._d >= new Date(Date.now() - 3600000))
        .sort((a, b) => a._d - b._d),
    [data.shoots]
  );

  const spullenWaarde = useMemo(
    () => data.spullen.reduce((s, x) => s + (Number(x.prijs) || 0), 0),
    [data.spullen]
  );

  if (!klaar)
    return (
      <div className="p-10 text-center" style={{ ...ui, background: C.paper, color: C.soft }}>
        Even geduld
      </div>
    );

  const tabs = [
    ["overzicht", "Overzicht"],
    ["facturen", "Facturen"],
    ["uitgaven", "Uitgaven"],
    ["btw", "Btw"],
    ["shoots", "Agenda"],
    ["spullen", "Apparatuur"],
  ];

  return (
    <div style={{ background: C.paper, minHeight: "100%" }}>
      <div className="max-w-2xl mx-auto px-5 py-8">
        <div
          className="text-sm mb-2"
          style={{ ...ui, color: C.soft, textAlign: "right" }}
        >
          versie 11
        </div>

        <header className="mb-7">
          <div
            className="text-xl"
            style={{ ...display, color: C.ink, letterSpacing: "0.22em" }}
          >
            MOMENTS BY DENISE
          </div>
          <div
            className="mt-1 text-sm"
            style={{ ...display, fontStyle: "italic", color: C.soft }}
          >
            Je shoots, je facturen en je btw op één plek
          </div>
          <div className="mt-4" style={{ borderTop: `1px solid ${C.line}` }} />
        </header>

        {melding && (
          <div
            className="px-4 py-3 mb-4 text-sm"
            style={{ ...ui, background: C.openZacht, color: C.open }}
          >
            {melding}
          </div>
        )}

        <nav className="flex gap-4 mb-6 overflow-x-auto" style={{ borderBottom: `1px solid ${C.line}` }}>
          {tabs.map(([k, l]) => (
            <button
              key={k}
              onClick={() => {
                setTab(k);
                setForm(null);
              }}
              className="pb-2 text-sm whitespace-nowrap cursor-pointer"
              style={{
                ...ui,
                background: "transparent",
                border: "none",
                color: tab === k ? C.ink : C.soft,
                borderBottom: tab === k ? `1px solid ${C.ink}` : "1px solid transparent",
                marginBottom: -1,
              }}
            >
              {l}
            </button>
          ))}
        </nav>

        {tab === "overzicht" && (
          <Overzicht
            btwNu={btwNu}
            kw={huidigKwartaal}
            openBedrag={openBedrag}
            openstaand={openstaand}
            omzetJaar={omzetJaar}
            uitgavenJaar={uitgavenJaar}
            kostenJaar={kostenJaar}
            komendeShoots={komendeShoots}
            spullenWaarde={spullenWaarde}
            data={data}
            bewaar={bewaar}
            naar={setTab}
          />
        )}
        {tab === "facturen" && (
          <Facturen
            facturen={data.facturen}
            form={form}
            setForm={setForm}
            voegToe={voegToe}
            voegMeerToe={voegMeerToe}
            wijzig={wijzig}
            verwijder={verwijder}
          />
        )}
        {tab === "uitgaven" && (
          <Uitgaven
            uitgaven={data.uitgaven}
            form={form}
            setForm={setForm}
            voegToe={voegToe}
            voegMeerToe={voegMeerToe}
            voegGecombineerdToe={voegGecombineerdToe}
            verwijder={verwijder}
          />
        )}
        {tab === "btw" && <Btw data={data} btwVan={btwVan} />}
        {tab === "shoots" && (
          <Shoots
            komende={komendeShoots}
            alle={data.shoots}
            form={form}
            setForm={setForm}
            voegToe={voegToe}
            verwijder={verwijder}
          />
        )}
        {tab === "spullen" && (
          <Spullen
            spullen={data.spullen}
            totaal={spullenWaarde}
            form={form}
            setForm={setForm}
            voegToe={voegToe}
            wijzig={wijzig}
            verwijder={verwijder}
          />
        )}
      </div>
    </div>
  );
}

/* ---------- overzicht ---------- */
function Overzicht({
  btwNu,
  kw,
  openBedrag,
  openstaand,
  omzetJaar,
  uitgavenJaar,
  kostenJaar,
  komendeShoots,
  spullenWaarde,
  data,
  bewaar,
  naar,
}) {
  const teLaat = openstaand.filter((f) => f.vervaldatum && new Date(f.vervaldatum) < new Date());
  const deadline = aangifteDeadline(kw);

  const exporteer = () =>
    download(`momentsbydenise-${vandaag()}.json`, JSON.stringify(data, null, 2), "application/json");

  const importeer = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json";
    inp.onchange = () => {
      const f = inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          bewaar({ ...LEEG, ...JSON.parse(r.result) });
        } catch (e) {
          alert("Dit bestand kon ik niet lezen.");
        }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  return (
    <div>
      <Print
        nadruk
        onderschrift={`Lopend kwartaal, ${kwartaalLabel(kw)}. Je boekhouder doet de aangifte, uiterlijk ${deadline.toLocaleDateString(
          "nl-NL",
          { day: "numeric", month: "long" }
        )}.`}
      >
        <Bedrag
          groot
          label={btwNu.saldo >= 0 ? "Btw die je opzij moet zetten" : "Btw die je terugkrijgt"}
          waarde={euro(Math.abs(btwNu.saldo))}

/* ---------- facturen ---------- */
function Facturen({ facturen, form, setForm, voegToe, voegMeerToe, wijzig, verwijder }) {
  const [concepten, setConcepten] = useState([]);

  const volgend = () => {
    const nrs = facturen
      .map((f) => parseInt(String(f.nummer).replace(/\D/g, ""), 10))
      .filter((n) => !isNaN(n));
    const hoogste = nrs.length ? Math.max(...nrs) : 0;
    return `${new Date().getFullYear()}-${pad(hoogste % 1000 + 1)}`;
  };

  const leeg = () => ({
    nummer: volgend(),
    klant: "",
    omschrijving: "",
    datum: vandaag(),
    vervaldatum: new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10),
    bedrag: "",
    tarief: 21,
    status: "open",
  });

  const f = form || leeg();
  const zet = (k, v) => setForm({ ...f, [k]: v });

  const opslaan = () => {
    if (!f.klant.trim() || !f.bedrag) return;
    voegToe("facturen", f);
    setForm(null);
  };

  const groepen = groepeerPerKwartaal(facturen);

  return (
    <div>
      <Sleepvak
        uitleg="Zet hier de facturen die je hebt gestuurd"
        onKlaar={(lijst) =>
          setConcepten([
            ...concepten,
            ...lijst.map(({ tekst, naam }) => leesFactuur(tekst, naam)),
          ])
        }
      />

      <Controle
        soort="factuur"
        rijen={concepten}
        setRijen={setConcepten}
        opslaan={(rijen) => {
          const basis = leeg();
          voegMeerToe(
            "facturen",
            rijen.map(({ _bestand, _letop, ...r }, i) => ({
              ...r,
              nummer: r.nummer || `${basis.nummer.split("-")[0]}-${pad(Number(basis.nummer.split("-")[1]) + i)}`,
              vervaldatum: new Date(new Date(r.datum).getTime() + 14 * 86400000)
                .toISOString()
                .slice(0, 10),
            }))
          );
          setConcepten([]);
        }}
      />

      <div className="flex gap-2 mb-5 flex-wrap">
        <Knop soort="vol" onClick={() => setForm(leeg())}>
          Met de hand invullen
        </Knop>
      </div>

      {form && (
        <Print>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Factuurnummer">
                <Input value={f.nummer} onChange={(e) => zet("nummer", e.target.value)} />
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Factuurdatum">
                <Input type="date" value={f.datum} onChange={(e) => zet("datum", e.target.value)} />
              </Veld>
            </div>
          </div>
          <Veld label="Klant">
            <Input
              value={f.klant}
              onChange={(e) => zet("klant", e.target.value)}
              placeholder="Naam of bedrijf"
            />
          </Veld>
          <Veld label="Waarvoor">
            <Input
              value={f.omschrijving}
              onChange={(e) => zet("omschrijving", e.target.value)}
              placeholder="Bruiloftsreportage, bedrijfsshoot"
            />
          </Veld>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Bedrag exclusief btw">
                <Input
                  type="number"
                  step="0.01"
                  value={f.bedrag}
                  onChange={(e) => zet("bedrag", e.target.value)}
                />
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Btw-tarief">
                <Select value={f.tarief} onChange={(e) => zet("tarief", Number(e.target.value))}>
                  {TARIEVEN.map((t) => (
                    <option key={t.v} value={t.v}>
                      {t.l}
                    </option>
                  ))}
                </Select>
              </Veld>
            </div>
          </div>
          <Veld label="Betalen voor">
            <Input
              type="date"
              value={f.vervaldatum}
              onChange={(e) => zet("vervaldatum", e.target.value)}
            />
          </Veld>
          <div
            className="py-3 mb-3 text-sm"
            style={{ ...ui, color: C.soft, borderTop: `1px solid ${C.line}` }}
          >
            Btw {euro(btwUitExcl(f.bedrag, f.tarief))}, totaal op de factuur{" "}
            <span style={{ color: C.ink }}>
              {euro(Number(f.bedrag || 0) + btwUitExcl(f.bedrag, f.tarief))}
            </span>
          </div>
          <div className="flex gap-2">
            <Knop soort="vol" onClick={opslaan}>
              Factuur opslaan
            </Knop>
            <Knop soort="weg" onClick={() => setForm(null)}>
              Annuleren
            </Knop>
          </div>
        </Print>
      )}

      {facturen.length === 0 && !form && (
        <p className="text-sm" style={{ ...ui, color: C.soft }}>
          Nog geen facturen. Voeg er één toe, of laat ze uit je verzonden mail halen.
        </p>
      )}

      {groepen.map((groep) => (
        <div key={groep.sleutel}>
      <KwartaalKop
        kw={groep.kw}
        totaal={groep.items.reduce(
          (s, f) => s + Number(f.bedrag) + btwUitExcl(f.bedrag, f.tarief),
          0
        )}
        bijschrift={`${groep.items.length} factuur${groep.items.length > 1 ? "en" : ""}`}
      />
      {groep.items.map((x) => {
        const open = x.status !== "betaald";
        const laat = open && x.vervaldatum && new Date(x.vervaldatum) < new Date();
        return (
          <Regel
            key={x.id}
            titel={x.klant}
            onder={
              <>
                {x.nummer}, {datumKort(x.datum)}
                {x.omschrijving ? `, ${x.omschrijving}` : ""}
                {laat && (
                  <span style={{ color: C.open }}>
                    {`, ${dagenOpen(x.vervaldatum)} dagen over de datum`}
                  </span>
                )}
              </>
            }
            rechts={euro(Number(x.bedrag) + btwUitExcl(x.bedrag, x.tarief))}
            onderRechts={<Merk status={x.status} />}
            acties={
              <>
                <Knop
                  klein
                  onClick={() =>
                    wijzig("facturen", x.id, { status: open ? "betaald" : "open" })
                  }
                >
                  {open ? "Markeer als betaald" : "Toch nog open"}
                </Knop>
                <Knop klein soort="weg" onClick={() => verwijder("facturen", x.id)}>
                  Verwijderen
                </Knop>
              </>
            }
          />
        );
      })}
        </div>
      ))}
    </div>
  );
}

/* ---------- uitgaven ---------- */
function Uitgaven({ uitgaven, form, setForm, voegToe, voegMeerToe, voegGecombineerdToe, verwijder }) {
  const [concepten, setConcepten] = useState([]);
  const leeg = {
    naam: "",
    omschrijving: "",
    bedrag: "",
    tarief: 21,
    categorie: "",
    datum: vandaag(),
    zakelijk: true,
    apparatuur: false,
  };
  const f = form || leeg;
  const zet = (k, v) => setForm({ ...f, [k]: v });

  const opslaan = () => {
    if (!f.naam.trim() || !f.bedrag) return;
    voegGecombineerdToe({
      uitgaven: [f],
      spullen: f.apparatuur
        ? [
            {
              naam: f.omschrijving || f.naam,
              prijs: f.bedrag,
              datum: f.datum,
              categorie: raadCategorie(`${f.omschrijving} ${f.naam}`),
              serienummer: "",
              garantie: "",
            },
          ]
        : [],
    });
    setForm(null);
  };

  const groepen = groepeerPerKwartaal(uitgaven);
  const totaalTerug = uitgaven
    .filter((u) => u.zakelijk !== false)
    .reduce((s, u) => s + btwUitIncl(u.bedrag, u.tarief), 0);
  const totaalUit = uitgaven.reduce((s, u) => s + (Number(u.bedrag) || 0), 0);

  return (
    <div>

        <Bedrag label="Totaal uitgegeven" waarde={euro(totaalUit)} groot />

              Btw terug te vragen

              {euro(totaalTerug)}
            </div>
          </div>
          <div>
            <div className="text-sm" style={{ ...ui, color: C.soft }}>
              Kosten zonder btw
            </div>
            <div className="text-lg" style={{ ...display, color: C.ink }}>
              {euro(totaalUit - totaalTerug)}

      <Sleepvak
        uitleg="Zet hier je inkoopfacturen en bonnen"
        onKlaar={(lijst) =>
          setConcepten([
            ...concepten,
            ...lijst.map(({ tekst, naam }) => leesUitgave(tekst, naam)),
          ])
        }
      />

      <Controle
        soort="uitgave"
        rijen={concepten}
        setRijen={setConcepten}
        opslaan={(rijen) => {
          const schoon = rijen.map(({ _bestand, _letop, _regels, ...r }) => r);
          voegGecombineerdToe({
            uitgaven: schoon,
            spullen: schoon
              .filter((r) => r.apparatuur)
              .map((r) => ({
                naam: r.omschrijving || r.naam,
                prijs: r.bedrag,
                datum: r.datum,
                categorie: raadCategorie(`${r.omschrijving} ${r.naam}`),
                serienummer: "",
                garantie: "",
              })),
          });
          setConcepten([]);
        }}
      />

      <div className="mb-5">
        <Knop soort="vol" onClick={() => setForm(leeg)}>
          Met de hand invullen
        </Knop>
      </div>

      {form && (
        <Print>
          <Veld label="Van wie">
            <Input
              value={f.naam}
              onChange={(e) => zet("naam", e.target.value)}
              placeholder="CEWE, vidaXL, Coolblue"
            />
          </Veld>
          <Veld label="Wat is het">
            <Input
              value={f.omschrijving}
              onChange={(e) => zet("omschrijving", e.target.value)}
              placeholder="Sony A7 IV, fotoboeken, benzine"

                <Select value={f.tarief} onChange={(e) => zet("tarief", Number(e.target.value))}>

                    <option key={t.v} value={t.v}>

      {groepen.map((groep) => (

        kw={groep.kw}
        totaal={groep.items.reduce((s, u) => s + (Number(u.bedrag) || 0), 0)}
        bijschrift={`uitgegeven, btw ${euro(

        </div>

/* ---------- btw ---------- */
function Btw({ data, btwVan }) {
  const kwartalen = useMemo(() => {
    const set = new Map();
    [...data.facturen, ...data.uitgaven].forEach((x) => {
      const q = kwartaalVan(x.datum);
      set.set(`${q.jaar}-${q.k}`, q);
    });
    const nu = kwartaalVan(vandaag());
    set.set(`${nu.jaar}-${nu.k}`, nu);
    return [...set.values()].sort((a, b) => b.jaar - a.jaar || b.k - a.k);
  }, [data]);

  const exportKwartaal = (kw) => {
    const inKw = (d) => {
      const q = kwartaalVan(d);
      return q.jaar === kw.jaar && q.k === kw.k;
    };
    const regels = [["Soort", "Datum", "Omschrijving", "Bedrag excl", "Tarief", "Btw"]];
    data.facturen.filter((f) => inKw(f.datum)).forEach((f) =>
      regels.push([
        "Verkoop",
        f.datum,
        `${f.nummer} ${f.klant}`,
        (Number(f.bedrag) || 0).toFixed(2),
        `${f.tarief}%`,
        btwUitExcl(f.bedrag, f.tarief).toFixed(2),
      ])
    );
    data.uitgaven
      .filter((u) => inKw(u.datum) && u.zakelijk !== false)
      .forEach((u) =>
        regels.push([
          "Inkoop",
          u.datum,
          u.naam,
          ((Number(u.bedrag) || 0) - btwUitIncl(u.bedrag, u.tarief)).toFixed(2),
          `${u.tarief}%`,
          btwUitIncl(u.bedrag, u.tarief).toFixed(2),
        ])
      );
    const csv = regels.map((r) => r.map((c) => `"${c}"`).join(";")).join("\n");
    download(`btw-${kwartaalLabel(kw).replace(" ", "-")}.csv`, csv, "text/csv");
  };

  return (
    <div>
      <p className="text-sm mb-5" style={{ ...ui, color: C.soft }}>
        Dit is je eigen overzicht, geen aangifte. Stuur het bestand naar je boekhouder, dan
        heeft die alles in één keer.
      </p>

      {kwartalen.map((kw) => {
        const b = btwVan(kw);
        const deadline = aangifteDeadline(kw);
        const verstreken = deadline < new Date();
        return (
          <Print
            key={`${kw.jaar}-${kw.k}`}
            onderschrift={`Aangifte uiterlijk ${deadline.toLocaleDateString("nl-NL", {
              day: "numeric",
              month: "long",
              year: "numeric",
            })}${verstreken ? ", die datum is geweest" : ""}`}
          >
            <div className="flex items-baseline justify-between">
              <div className="text-xl" style={{ ...display, color: C.ink }}>
                {kwartaalLabel(kw)}
              </div>
              <div className="text-sm" style={{ ...ui, color: C.soft }}>
                {b.saldo >= 0 ? "Te betalen" : "Terug te krijgen"}
              </div>
            </div>
            <div
              className="text-3xl mt-2"
              style={{ ...display, color: b.saldo >= 0 ? C.open : C.goed }}
            >
              {euro(Math.abs(b.saldo))}
            </div>
            <div className="mt-4 pt-3 text-sm" style={{ ...ui, borderTop: `1px solid ${C.line}` }}>
              <div className="flex justify-between py-1" style={{ color: C.soft }}>
                <span>Btw op je facturen</span>
                <span style={{ ...display, color: C.ink }}>{euro(b.afdragen)}</span>
              </div>
              <div className="flex justify-between py-1" style={{ color: C.soft }}>
                <span>Btw op je inkopen</span>
                <span style={{ ...display, color: C.ink }}>min {euro(b.terug)}</span>
              </div>
            </div>
            <div className="mt-3">
              <Knop onClick={() => exportKwartaal(kw)}>Bestand voor de boekhouder</Knop>
            </div>
          </Print>
        );
      })}
    </div>
  );
}

/* ---------- shoots ---------- */
function Shoots({ komende, alle, form, setForm, voegToe, verwijder }) {
  const leeg = {
    titel: "",
    datum: vandaag(),
    tijd: "10:00",
    duur: 120,
    locatie: "",
    notitie: "",
    herinnering: 1440,
  };
  const f = form || leeg;
  const zet = (k, v) => setForm({ ...f, [k]: v });

  const opslaan = () => {
    if (!f.titel.trim()) return;
    voegToe("shoots", f);
    setForm(null);
  };

  const geweest = alle
    .map((a) => ({ ...a, _d: startEind(a).start }))
    .filter((a) => !komende.find((k) => k.id === a.id))
    .sort((a, b) => b._d - a._d);

  return (
    <div>
      <div className="flex gap-2 mb-5 flex-wrap">
        <Knop soort="vol" onClick={() => setForm(leeg)}>
          Shoot of afspraak inplannen
        </Knop>
        {komende.length > 0 && (
          <Knop onClick={() => download("agenda.ics", maakICS(komende), "text/calendar")}>
            Alles naar je agenda
          </Knop>
        )}
      </div>

      {form && (
        <Print>
          <Veld label="Wat staat er te gebeuren">
            <Input
              value={f.titel}
              onChange={(e) => zet("titel", e.target.value)}
              placeholder="Bruiloft Sanne en Tom"
            />
          </Veld>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Datum">
                <Input type="date" value={f.datum} onChange={(e) => zet("datum", e.target.value)} />
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Begintijd">
                <Input type="time" value={f.tijd} onChange={(e) => zet("tijd", e.target.value)} />
              </Veld>
            </div>
          </div>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Duur in minuten">
                <Input type="number" value={f.duur} onChange={(e) => zet("duur", e.target.value)} />
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Herinnering">
                <Select
                  value={f.herinnering}
                  onChange={(e) => zet("herinnering", Number(e.target.value))}
                >
                  {HERINNERINGEN.map((h) => (
                    <option key={h.v} value={h.v}>
                      {h.l}
                    </option>
                  ))}
                </Select>
              </Veld>
            </div>
          </div>
          <Veld label="Locatie">
            <Input value={f.locatie} onChange={(e) => zet("locatie", e.target.value)} />
          </Veld>
          <Veld label="Notitie">
            <Input
              value={f.notitie}
              onChange={(e) => zet("notitie", e.target.value)}
              placeholder="Welke lens, contactpersoon, parkeren"
            />
          </Veld>
          <div className="flex gap-2">
            <Knop soort="vol" onClick={opslaan}>
              Opslaan
            </Knop>
            <Knop soort="weg" onClick={() => setForm(null)}>
              Annuleren
            </Knop>
          </div>
        </Print>
      )}

      {komende.length === 0 && !form && (
        <p className="text-sm" style={{ ...ui, color: C.soft }}>
          Je agenda is leeg.
        </p>
      )}

      {komende.map((a) => (
        <Regel
          key={a.id}
          titel={a.titel}
          onder={`${a._d.toLocaleDateString("nl-NL", {
            weekday: "long",
            day: "numeric",
            month: "long",
          })} om ${a.tijd}${a.locatie ? `, ${a.locatie}` : ""}`}
          rechts=""
          acties={
            <>
              <a
                href={googleLink(a)}
                target="_blank"
                rel="noreferrer"
                className="px-4 py-2 text-sm no-underline"
                style={{ ...ui, background: C.ink, color: C.print }}
              >
                Naar Google Agenda
              </a>
              <Knop
                onClick={() =>
                  download(
                    `${a.titel.replace(/\W+/g, "-").toLowerCase()}.ics`,
                    maakICS([a]),
                    "text/calendar"
                  )
                }
              >
                Apple of Outlook
              </Knop>
              <Knop klein soort="weg" onClick={() => verwijder("shoots", a.id)}>
                Verwijderen
              </Knop>
            </>
          }
        />
      ))}

      {geweest.length > 0 && (
        <>
          <h2 className="text-2xl mt-8 mb-1" style={{ ...display, color: C.ink }}>
            Geweest
          </h2>
          {geweest.slice(0, 8).map((a) => (
            <Regel
              key={a.id}
              titel={<span style={{ color: C.soft }}>{a.titel}</span>}
              onder={a._d.toLocaleDateString("nl-NL", {
                day: "numeric",
                month: "long",
                year: "numeric",
              })}
              rechts=""
              acties={
                <Knop klein soort="weg" onClick={() => verwijder("shoots", a.id)}>
                  Verwijderen
                </Knop>
              }
            />
          ))}
        </>
      )}
    </div>
  );
}

/* ---------- spullen ---------- */
function Spullen({ spullen, totaal, form, setForm, voegToe, wijzig, verwijder }) {
  const [open, setOpen] = useState([]);
  const isOpen = (naam) => open.includes(naam);
  const wissel = (naam) =>
    setOpen(isOpen(naam) ? open.filter((x) => x !== naam) : [...open, naam]);
  const leeg = {
    naam: "",
    prijs: "",
    datum: vandaag(),
    categorie: CATEGORIEEN[0],
    serienummer: "",
    garantie: "",
  };
  const f = form || leeg;
  const zet = (k, v) => setForm({ ...f, [k]: v });

  const opslaan = () => {
    if (!f.naam.trim()) return;
    voegToe("spullen", { ...f, categorie: f.categorie || raadCategorie(f.naam) });
    setForm(null);
  };

  const groepen = CATEGORIEEN.map((c) => ({
    naam: c,
    items: spullen
      .filter((s) => (s.categorie || raadCategorie(s.naam)) === c)
      .sort((a, b) => (Number(b.prijs) || 0) - (Number(a.prijs) || 0)),
  })).filter((g) => g.items.length);

  return (
    <div>
      <Print onderschrift="Handig bij diefstal of schade, en je verzekeraar vraagt hier altijd naar.">
        <Bedrag
          label={`Aanschafwaarde van je spullen, ${spullen.length} stuks`}
          waarde={euro(totaal)}
        />
      </Print>

      <div className="mb-5">
        <Knop soort="vol" onClick={() => setForm(leeg)}>
          Apparatuur toevoegen
        </Knop>
      </div>

      {form && (
        <Print>
          <Veld label="Wat is het">
            <Input
              value={f.naam}
              onChange={(e) => zet("naam", e.target.value)}
              placeholder="Sony A7 IV, 50mm 1.8"
            />
          </Veld>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Aanschafprijs">
                <Input
                  type="number"
                  step="0.01"
                  value={f.prijs}
                  onChange={(e) => zet("prijs", e.target.value)}
                />
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Gekocht op">
                <Input type="date" value={f.datum} onChange={(e) => zet("datum", e.target.value)} />
              </Veld>
            </div>
          </div>
          <div className="flex gap-3">
            <div className="flex-1">
              <Veld label="Soort">
                <Select value={f.categorie} onChange={(e) => zet("categorie", e.target.value)}>
                  {CATEGORIEEN.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </Select>
              </Veld>
            </div>
            <div className="flex-1">
              <Veld label="Garantie tot">
                <Input
                  type="date"
                  value={f.garantie}
                  onChange={(e) => zet("garantie", e.target.value)}
                />
              </Veld>
            </div>
          </div>
          <Veld label="Serienummer">
            <Input
              value={f.serienummer}
              onChange={(e) => zet("serienummer", e.target.value)}
              placeholder="Optioneel"
            />
          </Veld>
          <div className="flex gap-2">
            <Knop soort="vol" onClick={opslaan}>
              Opslaan
            </Knop>
            <Knop soort="weg" onClick={() => setForm(null)}>
              Annuleren
            </Knop>
          </div>
        </Print>
      )}

      {spullen.length === 0 && !form && (
        <p className="text-sm" style={{ ...ui, color: C.soft }}>
          Begin met je camera's en lenzen, dat is meteen het grootste deel.
        </p>
      )}

      {groepen.map((groep) => (
        <div key={groep.naam}>
      <button
        onClick={() => wissel(groep.naam)}
        aria-expanded={isOpen(groep.naam)}
        className="w-full flex items-baseline justify-between pt-5 pb-2 cursor-pointer text-left"
        style={{
          background: "transparent",
          border: "none",
          borderBottom: `1px solid ${isOpen(groep.naam) ? C.ink : C.line}`,
        }}
      >
        <span className="text-xl flex items-baseline gap-2" style={{ ...display, color: C.ink }}>
          <span
            style={{
              display: "inline-block",
              fontSize: 12,
              color: C.soft,
              transform: isOpen(groep.naam) ? "rotate(90deg)" : "none",
              transition: "transform 120ms",
            }}
          >
            ▶
          </span>
          {groep.naam}
        </span>
        <span className="text-right">
          <span className="text-base block" style={{ ...display, color: C.ink }}>
            {euro(groep.items.reduce((s, x) => s + (Number(x.prijs) || 0), 0))}
          </span>
          <span className="text-sm block" style={{ ...ui, color: C.soft }}>
            {groep.items.length} stuk{groep.items.length > 1 ? "s" : ""}
          </span>
        </span>
      </button>
      {isOpen(groep.naam) && groep.items.map((s) => {
        const loopt = s.garantie && new Date(s.garantie) > new Date();
        return (
          <Regel
            key={s.id}
            titel={s.naam}
            onder={
              <>
                {new Date(s.datum).toLocaleDateString("nl-NL", { month: "long", year: "numeric" })}
                {s.categorie ? `, ${s.categorie}` : ""}
                {s.serienummer ? `, ${s.serienummer}` : ""}
                {s.garantie && (
                  <span style={{ color: loopt ? C.goed : C.soft }}>
                    {loopt
                      ? `, garantie tot ${new Date(s.garantie).toLocaleDateString("nl-NL")}`
                      : ", garantie verlopen"}
                  </span>
                )}
              </>
            }
            rechts={euro(s.prijs)}
            acties={
              <>
                <select
                  value={s.categorie || raadCategorie(s.naam)}
                  onChange={(e) => wijzig("spullen", s.id, { categorie: e.target.value })}
                  className="px-2 py-1 text-sm cursor-pointer"
                  style={{
                    ...ui,
                    background: C.print,
                    border: `1px solid ${C.line}`,
                    color: C.ink,
                    borderRadius: 0,
                  }}
                >
                  {CATEGORIEEN.map((c) => (
                    <option key={c} value={c}>
                      Verplaats naar {c}
                    </option>
                  ))}
                </select>
                <Knop klein soort="weg" onClick={() => verwijder("spullen", s.id)}>
                  Verwijderen
                </Knop>
              </>
            }
          />
        );
      })}
        </div>
      ))}
    </div>
  );
}


const wortel = document.getElementById("root");
wortel.dataset.gestart = "ja";
ReactDOM.createRoot(wortel).render(<App />);
</script>
</body>
